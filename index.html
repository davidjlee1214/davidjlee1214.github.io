<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>David Jeehwan Lee</title>
<meta name="description" content="David Jeehwan Lee, KAIST electrical engineering senior applying to EE PhD programs. Near-sensor AI hardware: sensor interface ICs, time-domain data conversion, and energy-efficient inference.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* Layout: a one-page research notebook. A signal-chain spine (Sense, Read out & convert, Move & store, Infer)
   carries the story, and every project ends in a datasheet-style spec table.
   To restyle the site, edit only the tokens in this first block (and the matching dark block below). */
:root{
  /* Color */
  --paper:#FBFCFE; --surface:#F1F4F9; --surface-2:#E6EBF3;
  --ink:#0E2841; --text:#26364B; --muted:#5B697D;
  --rule:#DCE2EB; --rule-strong:#B9C4D4;
  --accent:#1D4E89; --accent-ink:#FFFFFF; --link:#1A4F8F;
  --mark:#FFEF9A; --signal:#C8102E;
  --c1:#1D4E89; --c2:#0E7C78; --c3:#9C5D00; --c4:#A3346E;
  --bar-2:#8F9BAE; --bar-3:#CDD4DF;
  --on-strong:#FFFFFF; --scrim:rgba(14,40,65,.55); --sheet:#FFFFFF;
  --fig-sheath:#CDE8F6; --fig-rot:#F7CFB4; --fig-fiber:#F9D5D5; --fig-contact:#BFC5CE; --fig-cell:#F8C97A; --fig-cell-line:#D99A3E;
  /* Type */
  --f-display:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* Space */
  --maxw:1120px; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A121D; --surface:#111C2B; --surface-2:#18263A;
    --ink:#EAF0F8; --text:#C5CFDC; --muted:#8F9CB1;
    --rule:#223148; --rule-strong:#34475F;
    --accent:#8DB4F2; --accent-ink:#0A121D; --link:#9CBFF6;
    --mark:rgba(255,206,77,.30); --signal:#FF6B6B;
    --c1:#8DB4F2; --c2:#4CC3BA; --c3:#E7B14C; --c4:#E87DB3;
    --bar-2:#64748A; --bar-3:#36475D;
    --on-strong:#0A121D; --scrim:rgba(0,0,0,.66); --sheet:#FFFFFF;
    --fig-sheath:#1E4760; --fig-rot:#6E4630; --fig-fiber:#6B3440; --fig-contact:#4B5566; --fig-cell:#B9862F; --fig-cell-line:#D9A44E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A121D; --surface:#111C2B; --surface-2:#18263A;
  --ink:#EAF0F8; --text:#C5CFDC; --muted:#8F9CB1;
  --rule:#223148; --rule-strong:#34475F;
  --accent:#8DB4F2; --accent-ink:#0A121D; --link:#9CBFF6;
  --mark:rgba(255,206,77,.30); --signal:#FF6B6B;
  --c1:#8DB4F2; --c2:#4CC3BA; --c3:#E7B14C; --c4:#E87DB3;
  --bar-2:#64748A; --bar-3:#36475D;
  --on-strong:#0A121D; --scrim:rgba(0,0,0,.66); --sheet:#FFFFFF;
  --fig-sheath:#1E4760; --fig-rot:#6E4630; --fig-fiber:#6B3440; --fig-contact:#4B5566; --fig-cell:#B9862F; --fig-cell-line:#D9A44E;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3,h4{text-wrap:balance}
p{margin:0}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
mark{color:inherit;background-color:transparent;background-image:linear-gradient(var(--mark),var(--mark));background-repeat:no-repeat;background-size:100% 78%;background-position:0 70%;padding:0 .1em;border-radius:2px;animation:sweep .9s .3s cubic-bezier(.3,.7,.3,1) both}
@keyframes sweep{from{background-size:0% 78%}to{background-size:100% 78%}}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:500 .9375rem/1 var(--f-body);padding:11px 16px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-small{padding:7px 12px;font-size:.875rem}
.email-chip{display:inline-flex;align-items:center;border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden;max-width:100%}
.email-chip .addr{font-family:var(--f-mono);font-size:.875rem;color:var(--ink);padding:10px 12px;user-select:all;overflow-wrap:anywhere}
.email-chip .copy{font:500 .8125rem/1 var(--f-body);border:0;border-left:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);padding:12px 12px;cursor:pointer;align-self:stretch}
.email-chip .copy:hover{background:var(--surface-2)}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.topbar-inner{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;justify-content:flex-end}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:.875rem;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
.nav a:hover,.nav a.active{color:var(--ink);background:var(--surface)}
@media (max-width:640px){.brand{display:none}.nav{justify-content:flex-start}}

/* Hero */
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,64px);align-items:start;padding-block:clamp(40px,7vw,84px) clamp(28px,4vw,48px)}
.status{display:inline-flex;align-items:center;gap:8px;max-width:100%;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.04em;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:5px 12px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);flex:none}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2.5rem,5.4vw,3.75rem);line-height:1.04;letter-spacing:-.015em;color:var(--ink);margin:18px 0 6px}
.affil{color:var(--muted);font-size:1rem}
.tagline{font-family:var(--f-display);font-weight:500;font-size:clamp(1.35rem,2.5vw,1.8rem);line-height:1.32;color:var(--ink);max-width:28ch;margin:22px 0 16px;text-wrap:balance}
.summary{max-width:64ch}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:32px 0 0;padding-top:16px;border-top:1px solid var(--rule)}
.facts dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:4px 0 0;color:var(--ink);font-weight:500;font-size:.95rem;line-height:1.4}
.portrait{width:clamp(170px,21vw,250px);max-width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid var(--rule);background:var(--surface)}
@media (max-width:860px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.hero-grid{grid-template-columns:1fr}.portrait{order:-1;width:132px}}

/* Selected results */
.band{background:var(--surface);border-block:1px solid var(--rule)}
.highlights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-block:24px}
.hl{display:block;padding:4px 20px;border-left:1px solid var(--rule);text-decoration:none;color:inherit;min-width:0}
.hl:first-child{border-left:0;padding-left:0}
.hl .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:500;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.hl .u{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.hl .l{display:block;font-size:.875rem;line-height:1.45;color:var(--text);margin-top:6px}
.hl:hover .v{color:var(--accent)}
@media (max-width:900px){.highlights{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:20px}.hl:nth-child(3){border-left:0;padding-left:0}}
@media (max-width:460px){.highlights{grid-template-columns:1fr}.hl{border-left:0;padding-left:0}}

/* Sections */
.section{padding-block:clamp(52px,7vw,88px);scroll-margin-top:56px}
.section + .section{border-top:1px solid var(--rule)}
.section-head{display:grid;gap:8px;margin-bottom:32px;max-width:72ch}
.section-head h2{font-family:var(--f-display);font-weight:600;font-size:clamp(1.65rem,3vw,2.2rem);line-height:1.15;color:var(--ink);margin:0}
.section-head .lead{font-family:var(--f-display);font-size:clamp(1.15rem,2vw,1.35rem);line-height:1.4;color:var(--ink)}
.section-head .intro{color:var(--muted)}

/* Vision */
.vision-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.pillar{border-top:2px solid var(--ink);padding-top:14px;min-width:0}
.pillar h3{font:600 1.05rem/1.3 var(--f-body);color:var(--ink);margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pillar h3 span{font-family:var(--f-mono);font-size:.7rem;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pillar p{margin-top:8px}
.evidence{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;margin-top:36px;align-items:start}
.stats{display:grid;gap:12px}
.stat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px}
.stat .num{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;color:var(--signal);white-space:nowrap}
.stat p{font-size:.9rem;line-height:1.45}
.source{font-size:.78rem;color:var(--muted);line-height:1.45}
@media (max-width:900px){.vision-grid,.evidence{grid-template-columns:1fr}}

/* One thread */
.thread{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage-head{position:relative;display:flex;align-items:baseline;gap:10px;background:var(--ink);color:var(--paper);font-weight:600;padding:10px 14px;border-radius:8px}
.stage-head .n{font-family:var(--f-mono);font-size:.8rem;font-weight:500;opacity:.7}
.stage:not(:last-child) .stage-head::after{content:"";position:absolute;right:-17px;top:50%;transform:translateY(-50%);border:7px solid transparent;border-left:10px solid var(--rule-strong);border-right:0}
.tcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 15px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.tcard:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-1px)}
.tcard .proj{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.03em;color:var(--muted)}
.tcard .lesson{font-family:var(--f-display);font-weight:600;font-size:1.08rem;line-height:1.3;color:var(--ink)}
.tcard .ev{font-size:.86rem;line-height:1.5}
.goal{margin-top:26px;display:grid;gap:12px}
.goal-line{position:relative;height:2px;background:var(--signal);margin-inline:6px}
.goal-line::before,.goal-line::after{content:"";position:absolute;top:50%;transform:translateY(-50%);border:6px solid transparent}
.goal-line::before{left:-8px;border-right:10px solid var(--signal);border-left:0}
.goal-line::after{right:-8px;border-left:10px solid var(--signal);border-right:0}
.goal p{text-align:center;font-size:1.05rem;color:var(--ink);text-wrap:balance}
.goal strong{color:var(--signal)}
@media (max-width:960px){.thread{grid-template-columns:repeat(2,minmax(0,1fr))}.stage:nth-child(2) .stage-head::after{display:none}}
@media (max-width:560px){.thread{grid-template-columns:1fr}.stage .stage-head::after{display:none}}

/* Research and projects */
.entry{display:grid;gap:28px}
.entry + .entry{margin-top:64px}
.entry-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 24px;border-bottom:1px solid var(--rule-strong);padding-bottom:12px}
.entry-head h3{font-family:var(--f-display);font-weight:600;font-size:1.5rem;line-height:1.2;color:var(--ink);margin:0}
.entry-head .role{margin-top:4px;color:var(--text)}
.entry-head .role .adv{color:var(--muted)}
.entry-head .when{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);text-align:right;line-height:1.5}
.project{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:32px;align-items:start;scroll-margin-top:72px}
.project + .project{padding-top:32px;border-top:1px dashed var(--rule-strong)}
.project h4{font:600 1.15rem/1.35 var(--f-body);color:var(--ink);margin:0}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.68rem;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.proj-dates{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-top:4px}
.bullets{margin:14px 0 0;padding-left:1.15em;display:grid;gap:9px}
.bullets li::marker{color:var(--rule-strong)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tools span{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:3px 8px}
.side{display:grid;gap:18px;min-width:0}
figure{margin:0}
.fig{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 14px 12px;min-width:0}
.fig-scroll{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:430px}
.fig svg.chart{min-width:360px}
.fig img{display:block;width:100%;height:auto;border-radius:6px}
.fig figcaption{font-size:.8rem;color:var(--muted);margin-top:10px;line-height:1.45}
.specs{width:100%;border-collapse:collapse;font-size:.85rem}
.specs caption{text-align:left;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.specs th,.specs td{padding:6px 0;border-bottom:1px solid var(--rule);vertical-align:top;text-align:left}
.specs tr:first-child th,.specs tr:first-child td{border-top:1.5px solid var(--ink)}
.specs th{font-weight:500;color:var(--muted);width:40%;padding-right:12px}
.specs td{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.spec-note{font-size:.75rem;color:var(--muted);margin-top:8px;line-height:1.45}
@media (max-width:900px){.project{grid-template-columns:1fr;gap:20px}}
.project.wide .side{grid-column:2;grid-row:1}
.wide-figs{grid-column:1/-1;min-width:0}
@media (max-width:900px){.project.wide .side{grid-column:auto;grid-row:auto}}
.figtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.figtab{font:500 .82rem/1 var(--f-body);padding:7px 13px;border-radius:999px;border:1px solid var(--rule-strong);background:var(--paper);color:var(--muted);cursor:pointer}
.figtab:hover{color:var(--ink);border-color:var(--accent)}
.figtab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.zoomable{display:block;width:100%;padding:0;border:0;border-radius:8px;background:var(--sheet);cursor:zoom-in;overflow:hidden}
.zoomable img{display:block;width:100%;height:auto;border-radius:0}
.zoom-hint{color:var(--muted);white-space:nowrap}
.zoom-overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zoom-panel{background:var(--paper);border:1px solid var(--rule);border-radius:14px;width:100%;max-width:1680px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.zoom-body{overflow:auto;background:var(--sheet)}
.zoom-body img{display:block;width:100%;min-width:900px;height:auto}
@media (max-width:640px){.entry-head .when{text-align:left}}

/* Diagrams and charts (inline SVG, colored from the tokens) */
.dg{font-family:var(--f-mono);font-size:12.5px}
.dg text{fill:var(--text)}
.dg .lbl{fill:var(--muted);font-size:11px}
.dg .ttl{fill:var(--ink);font-weight:500}
.dg .val{fill:var(--ink);font-size:11px;font-weight:500}
.dg .strong{fill:var(--ink);font-weight:500}
.dg .acc{fill:var(--accent);font-weight:500}
.dg text.on{fill:var(--on-strong);font-weight:500}
.dg .box{fill:var(--paper);stroke:var(--rule-strong);stroke-width:1}
.dg .box-acc{fill:var(--paper);stroke:var(--accent);stroke-width:1.6}
.dg .wire{stroke:var(--muted);stroke-width:1.2;fill:none}
.dg .bus{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.dg .sig{stroke:var(--ink);stroke-width:1.4;fill:none}
.dg .guide{stroke:var(--rule-strong);stroke-width:1;stroke-dasharray:2 3}
.dg .grid{stroke:var(--rule);stroke-width:1}
.dg .axis{stroke:var(--rule-strong);stroke-width:1}
.dg .ah{fill:var(--muted)}
.dg .xing{stroke:var(--signal);stroke-width:1.3;stroke-dasharray:4 3;fill:none}
.dg .xing-t{fill:var(--signal);font-size:10.5px}
.dg .tube{fill:var(--surface-2);stroke:var(--muted);stroke-width:1.2}
.dg .motor{fill:var(--surface-2);stroke:var(--muted);stroke-width:1.2}
.dg .fiber{stroke:var(--c1);stroke-width:2.6;stroke-linecap:round}
.dg .mmf{fill:var(--c1);opacity:.55}
.dg .mirror{stroke:var(--c4);stroke-width:4;fill:none;stroke-linecap:round}
.dg .beam{fill:var(--c1);opacity:.25}
.dg .tissue{fill:var(--mark)}
.dg .row{stroke:var(--c1);stroke-width:1;opacity:.6}
.dg .col{stroke:var(--c2);stroke-width:1;opacity:.6}
.dg .dot{fill:var(--ink)}
.dg .mux{fill:var(--paper);stroke:var(--muted);stroke-width:1.2}
.dg .hl-band{fill:var(--mark);opacity:.7}
.dg .cap{stroke-width:3;stroke-linecap:round}
.dg .f-acc{fill:var(--accent)} .dg .f-b2{fill:var(--bar-2)} .dg .f-b3{fill:var(--bar-3)} .dg .f-sig{fill:var(--signal)}
.dg .s1{stroke:var(--c1)} .dg .s2{stroke:var(--c2)} .dg .s3{stroke:var(--c3)} .dg .s4{stroke:var(--c4)}
.dg .k1{fill:var(--c1)} .dg .k2{fill:var(--c2)} .dg .k3{fill:var(--c3)} .dg .k4{fill:var(--c4)}
.dg .pf-wall{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.dg .pf-contact{fill:var(--fig-contact);stroke:var(--ink);stroke-width:1}
.dg .pf-sheath{fill:var(--fig-sheath);stroke:var(--ink);stroke-width:.8}
.dg .pf-rot{fill:var(--fig-rot);stroke:var(--ink);stroke-width:.8}
.dg .pf-fiber{fill:var(--fig-fiber);stroke:var(--ink);stroke-width:.8}
.dg .pf-line{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.dg .pf-beam{fill:none;stroke:var(--signal);stroke-width:2;stroke-linejoin:round}
.dg .pf-cell{fill:var(--fig-cell);stroke:var(--ink);stroke-width:1}
.dg .pf-dend{fill:none;stroke:var(--fig-cell-line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .pf-arrow{fill:none;stroke:var(--c1);stroke-width:1.3}
.dg .pf-ah{fill:var(--c1)}
.dg .pf-t{font-family:var(--f-body);font-size:11px;fill:var(--text)}
.dg .pf-h{font-family:var(--f-body);font-size:11.5px;font-weight:600;fill:var(--ink)}
.dg .pf-i{font-family:var(--f-body);font-size:11px;font-style:italic;font-weight:600;fill:var(--ink)}

/* Publications and news */
.pub-news{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:48px}
.subhead{font-family:var(--f-display);font-weight:600;font-size:1.35rem;color:var(--ink);margin:0 0 14px}
.pubs{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.pub{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:10px}
.pub .key{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);padding-top:2px}
.pub .title{color:var(--ink);font-weight:500;line-height:1.45}
.pub .authors,.pub .venue{font-size:.92rem;margin-top:2px}
.pub .venue{color:var(--muted)}
.status-tag{display:inline-block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.news{list-style:none;margin:0;padding:0}
.news li{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid var(--rule);font-size:.93rem;line-height:1.5}
.news li:last-child{border-bottom:1px solid var(--rule)}
.news time{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);padding-top:2px;white-space:nowrap}
@media (max-width:860px){.pub-news{grid-template-columns:1fr;gap:40px}}

/* About */
.about-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:44px;align-items:start}
.about-text{display:grid;gap:14px;max-width:66ch}
.how{margin-top:8px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px}
.how h3{font-family:var(--f-mono);font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.aside{display:grid;gap:26px;min-width:0}
.block h3{font-family:var(--f-mono);font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.edu{border-top:1.5px solid var(--ink);padding-top:10px}
.edu .school{color:var(--ink);font-weight:600}
.edu .meta{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-top:2px}
.edu p{font-size:.92rem;margin-top:6px}
.skills{margin:0;display:grid;gap:10px}
.skills div{border-top:1px solid var(--rule);padding-top:8px}
.skills dt{font-weight:600;color:var(--ink);font-size:.9rem}
.skills dd{margin:2px 0 0;font-size:.88rem;color:var(--text)}
.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:44px;margin-top:48px}
.dated{list-style:none;margin:0;padding:0}
.dated li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 0;border-top:1px solid var(--rule);font-size:.92rem;line-height:1.45}
.dated li:last-child{border-bottom:1px solid var(--rule)}
.dated .d{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);white-space:nowrap;flex:none}
.dated strong{color:var(--ink);font-weight:600}
@media (max-width:860px){.about-grid,.lists{grid-template-columns:1fr}}
@media (max-width:480px){.dated li{flex-direction:column;gap:2px}}

/* Footer */
.footer{background:var(--surface);border-top:1px solid var(--rule)}
.footer-inner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-block:48px 40px}
.footer h2{font-family:var(--f-display);font-weight:600;font-size:1.6rem;color:var(--ink);margin:0 0 8px}
.footer p{max-width:58ch}
.footer .actions{margin-top:18px}
.footer .updated{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-align:right}
@media (max-width:720px){.footer-inner{grid-template-columns:1fr}.footer .updated{text-align:left}}

/* CV viewer */
.cv-overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.cv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.cv-bar h2{font-family:var(--f-display);font-size:1.15rem;font-weight:600;color:var(--ink);margin:0 auto 0 4px}
.cv-status{font-size:.82rem;color:var(--muted)}
.cv-pages{overflow:auto;padding:16px;display:grid;gap:16px;background:var(--surface)}
.cv-pages img{display:block;width:100%;height:auto;background:var(--sheet);border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
body.cv-open{overflow:hidden}

@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

  let figCount = 0;
  function figureHTML(f) {

  }
  function zoomImg(f) {
    return `<button type="button" class="zoomable" data-zoom="${esc(f.src)}" data-zoom-title="${esc(f.label || f.alt || "Figure")}" aria-label="Enlarge figure${f.label ? ": " + esc(f.label) : ""}"><img src="${esc(f.src)}" alt="${esc(f.alt || "")}" loading="lazy"></button>`;
  }
  function figureSetHTML(list) {
    const id = "fs" + (++figCount);

    const panels = list.map((f, i) => {

  }
  function specsHTML(p) {
    if (!(p.specs || []).length) return "";

  }

    const figs = (p.figures || []).length ? figureSetHTML(p.figures) : figureHTML(p.figure);
    const wide = !!(p.wide && figs);

    return `<article class="project${wide ? " wide" : ""}"${p.id ? ` id="${esc(p.id)}"` : ""}>
      <div class="proj-main">
        <h4>${md(p.title)}${p.tag ? ` <span class="tag">${esc(p.tag)}</span>` : ""}</h4>

    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {

        const a = links.get(en.target.id);
        if (a) { a.classList.add("active"); a.scrollIntoView({ block: "nearest", inline: "nearest" }); }

  /* ---------- Charts ---------- */
  function logBars(c) {
    const W = 520, L = 128, R = 440, T = 30, rh = 28, n = c.rows.length, B = T + n * rh, H = B + 36;
    const lo = Math.log10(c.min), hi = Math.log10(c.max);
    const X = (v) => L + ((Math.log10(v) - lo) / (hi - lo)) * (R - L);
    let s = `<svg viewBox="0 0 ${W} ${H}" class="dg chart" role="img" aria-label="${esc(c.title)}">`;
    s += `<text x="0" y="14" class="ttl">${esc(c.title)}</text>`;
    for (let e = Math.ceil(lo); e <= Math.floor(hi); e++) {
      const v = Math.pow(10, e), x = X(v);
      s += `<line x1="${x}" y1="${T - 4}" x2="${x}" y2="${B}" class="grid"/><text x="${x}" y="${B + 15}" text-anchor="middle" class="lbl">${fmt(+v.toPrecision(3))}</text>`;
    }
    s += `<text x="${(L + R) / 2}" y="${B + 31}" text-anchor="middle" class="lbl">${esc(c.unit)} per operation</text>`;
    c.rows.forEach((r, i) => {
      const y = T + i * rh, x = X(r.value);
      s += `<text x="${L - 10}" y="${y + 15}" text-anchor="end">${esc(r.label)}</text>`;
      s += `<rect x="${L}" y="${y + 4}" width="${Math.max(2, x - L)}" height="15" rx="2" class="${tone(r.tone)}"><title>${esc(r.label)}: ${fmt(r.value)} ${esc(c.unit)}</title></rect>`;
      s += `<text x="${x + 6}" y="${y + 15}" class="val">${fmt(r.value)} ${esc(c.unit)}</text>`;
    });
    return s + `</svg>`;
  }

  function groupedBars(c) {
    const W = 520, L = 40, R = 512, T = 46, B = 212, H = 262;
    const n = c.categories.length, gw = (R - L) / n, ns = c.series.length, gap = 3;
    const bw = Math.min(24, (gw - 20 - (ns - 1) * gap) / ns);
    const Y = (v) => B - (v / c.yMax) * (B - T);
    const unit = c.yUnit || "";
    let s = `<svg viewBox="0 0 ${W} ${H}" class="dg chart" role="img" aria-label="${esc(c.ariaLabel || "Grouped bar chart")}">`;
    let lx = L;
    c.series.forEach((se) => {
      s += `<rect x="${lx}" y="8" width="11" height="11" rx="2" class="${tone(se.tone)}"/><text x="${lx + 16}" y="18">${esc(se.name)}</text>`;
      lx += 16 + se.name.length * 7.6 + 18;
    });
    if (c.highlight) {
      const hx = L + c.highlight.index * gw;
      s += `<rect x="${hx + 2}" y="${T - 16}" width="${gw - 4}" height="${B - T + 16}" rx="4" class="hl-band"/>`;
      s += `<text x="${hx + gw / 2}" y="${T - 5}" text-anchor="middle" class="lbl">${esc(c.highlight.label)}</text>`;
    }
    for (let v = 0; v <= c.yMax; v += c.yStep || 25) {
      const y = Y(v);
      s += `<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" class="${v === 0 ? "axis" : "grid"}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" class="lbl">${v}${esc(unit)}</text>`;
    }
    c.categories.forEach((cat, i) => {
      const gx = L + i * gw + (gw - (ns * bw + (ns - 1) * gap)) / 2;
      c.series.forEach((se, j) => {
        const v = se.values[i], x = gx + j * (bw + gap), y = Y(v);
        s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(B - y).toFixed(1)}" rx="1.5" class="${tone(se.tone)}"><title>${esc(se.name)}, ${esc(cat)}: ${v}${esc(unit)}</title></rect>`;
        if (c.highlight && c.highlight.index === i) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" class="val">${Math.round(v)}</text>`;
      });
      s += `<text x="${L + i * gw + gw / 2}" y="${B + 16}" text-anchor="middle" class="lbl">${esc(cat)}</text>`;
    });
    if (c.xTitle) s += `<text x="${(L + R) / 2}" y="${B + 38}" text-anchor="middle" class="lbl">${esc(c.xTitle)}</text>`;
    return s + `</svg>`;
  }

  /* ---------- Built-in diagrams (simplified concept drawings) ---------- */
  const defs = (id) => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>`;
  const DIAGRAMS = {
    cdc(uid) {
      const a = "ah-" + uid, W = 520, H = 300, bw = 112, by = 28, bh = 58;
      const xs = [10, 136, 262, 388], ph = ["0°", "45°", "90°", "135°"];
      let s = `<svg viewBox="0 0 ${W} ${H}" class="dg" role="img" aria-label="Concept of the quad-channel CDC: four oscillator cells in a ring, each with one sensor capacitor, and the eight timing windows per period that the sensors set">${defs(a)}`;

      xs.forEach((x, i) => {

        s += `<line x1="${x + 12}" y1="${by + 39}" x2="${x + 23}" y2="${by + 39}" class="wire"/><line x1="${x + 31}" y1="${by + 39}" x2="${x + 42}" y2="${by + 39}" class="wire"/>`;
        s += `<line x1="${x + 23}" y1="${by + 29}" x2="${x + 23}" y2="${by + 49}" class="cap s${k}"/><line x1="${x + 31}" y1="${by + 29}" x2="${x + 31}" y2="${by + 49}" class="cap s${k}"/>`;
        s += `<text x="${x + 50}" y="${by + 43}" class="k${k}" font-weight="500">C<tspan font-size="8" dy="3">S${k}</tspan></text>`;
        if (i < 3) s += `<line x1="${x + bw + 1}" y1="${by + bh / 2}" x2="${xs[i + 1] - 2}" y2="${by + bh / 2}" class="wire" marker-end="url(#${a})"/>`;
      });
      const fy = by + bh + 18;
      s += `<path d="M${xs[3] + bw},${by + bh / 2} H${W - 3} V${fy} H4 V${by + bh / 2} H8" class="wire" marker-end="url(#${a})"/>`;
      s += `<text x="${W / 2}" y="${fy - 5}" text-anchor="middle" class="lbl">inverted feedback</text>`;
      const X0 = 90, P = 400, st = P / 8, top = 128, rh = 26, amp = 14;
      for (let j = 0; j <= 8; j++) s += `<line x1="${X0 + j * st}" y1="${top}" x2="${X0 + j * st}" y2="${top + 108}" class="guide"/>`;
      for (let k = 0; k < 4; k++) {
        const yb = top + 22 + k * rh, yh = yb - amp, r = X0 + k * st, f = r + P / 2;
        s += `<text x="10" y="${yb - 2}" class="lbl">φ ${ph[k]}</text>`;
        s += `<path d="M${X0 - 12},${yb} H${r} V${yh} H${f} V${yb} H${X0 + P}" class="sig"/>`;
      }
      const wy = top + 114;
      s += `<text x="10" y="${wy + 13}" class="lbl">windows</text>`;
      for (let j = 0; j < 8; j++) {
        const k = (j % 4) + 1, x = X0 + j * st;
        s += `<rect x="${x + 1}" y="${wy}" width="${st - 2}" height="18" rx="2" class="k${k}"/><text x="${x + st / 2}" y="${wy + 13}" text-anchor="middle" class="on">t${k}</text>`;
      }
      const ty = wy + 32;
      s += `<path d="M${X0},${ty - 5} V${ty} H${X0 + P} V${ty - 5}" class="wire"/>`;
      s += `<text x="${X0 + P / 2}" y="${ty + 16}" text-anchor="middle" class="lbl">one period T ≈ 372 ns at 200 fF · each window ≈ T/8</text>`;

    iongel(uid) {
      const a = "ah-" + uid, W = 520, H = 262;
      let s = `<svg viewBox="0 0 ${W} ${H}" class="dg" role="img" aria-label="Ion-gel array readout chain: array, two multiplexers, PCap04 converter, Arduino, Python host, and a live 3 by 3 capacitance map">${defs(a)}`;
      const gx = 12, gy = 34, n = 10, sp = 11;
      s += `<text x="${gx}" y="20" class="lbl">10 × 10 ion-gel array</text>`;
      for (let i = 0; i < n; i++) s += `<line x1="${gx}" y1="${gy + i * sp + 5}" x2="${gx + n * sp}" y2="${gy + i * sp + 5}" class="row"/>`;
      for (let j = 0; j < n; j++) s += `<line x1="${gx + j * sp + 5}" y1="${gy}" x2="${gx + j * sp + 5}" y2="${gy + n * sp}" class="col"/>`;

      s += `<line x1="${gx + n * sp}" y1="64" x2="149" y2="64" class="wire"/><line x1="${gx + n * sp}" y1="124" x2="149" y2="124" class="wire"/>`;
      s += `<path d="M176,64 H190 V84 H202" class="wire" marker-end="url(#${a})"/><path d="M176,124 H190 V104 H202" class="wire" marker-end="url(#${a})"/>`;
      const box = (x, t1, t2, cls) => `<rect x="${x}" y="66" width="84" height="56" rx="6" class="${cls || "box"}"/><text x="${x + 42}" y="90" text-anchor="middle" class="strong">${t1}</text><text x="${x + 42}" y="106" text-anchor="middle" class="lbl">${t2}</text>`;
      s += box(204, "PCap04", "CDC", "box-acc") + box(312, "Arduino", "controller") + box(420, "Python", "host");
      s += `<line x1="288" y1="94" x2="310" y2="94" class="wire" marker-end="url(#${a})"/><text x="299" y="86" text-anchor="middle" class="lbl">I²C</text>`;
      s += `<line x1="396" y1="94" x2="418" y2="94" class="wire" marker-end="url(#${a})"/>`;
      s += `<text x="204" y="146" class="lbl">discharge resistor</text><text x="204" y="162" class="acc">10 kΩ → 180 kΩ</text><text x="204" y="178" class="lbl">pressure response ≈ 2×</text>`;
      s += `<text x="12" y="168" class="lbl">LCR sweep: response</text><text x="12" y="182" class="lbl">at 100 Hz–1 kHz,</text><text x="12" y="196" class="lbl">gone by 1 MHz</text>`;
      const vals = [[6.34, 6.55, 7.08], [11.92, 11.93, 14.3], [32.0, 28.68, 29.08]], cx0 = 418, cy0 = 146, cs = 30, vmin = 5, vmax = 32;
      s += `<line x1="462" y1="124" x2="462" y2="${cy0 - 3}" class="wire" marker-end="url(#${a})"/>`;
      vals.forEach((row, r) => row.forEach((v, c) => {
        const pct = Math.round(15 + 85 * Math.min(1, Math.max(0, (v - vmin) / (vmax - vmin))));
        s += `<rect x="${cx0 + c * cs}" y="${cy0 + r * cs}" width="${cs - 2}" height="${cs - 2}" rx="2" style="fill:color-mix(in oklab, var(--accent) ${pct}%, var(--paper))"/>`;
        s += `<text x="${cx0 + c * cs + (cs - 2) / 2}" y="${cy0 + r * cs + 18}" text-anchor="middle" font-size="10"${pct > 55 ? ' class="on"' : ""}>${v.toFixed(1)}</text>`;
      }));
      s += `<text x="${cx0 + 3 * cs - 2}" y="${cy0 + 3 * cs + 16}" text-anchor="end" class="lbl">live ΔC map (pF), 7.7 frames/s</text>`;
      return s + `</svg>`;
    },

    probe(uid) {
      const W = 520, H = 580, a = "pa-" + uid;
      let s = `<svg viewBox="0 0 ${W} ${H}" class="dg" role="img" aria-label="Probe cross-section: stationary single-mode to multi-mode fiber core in a metal tube, a rotating layer carrying an elliptical mirror, a clear outer sheath, and the DBS electrode; the beam reflects off the mirror to a focus in tissue">`;
      s += `<defs><marker id="${a}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="pf-ah"/></marker></defs>`;
      // DBS electrode walls with contacts
      [16, 252].forEach((x) => {
        s += `<rect x="${x}" y="34" width="12" height="532" class="pf-wall"/>`;
        [64, 176, 288, 400].forEach((y) => { s += `<rect x="${x}" y="${y}" width="12" height="48" class="pf-contact"/>`; });
      });
      // 3rd layer: clear outer sheath
      s += `<rect x="40" y="44" width="10" height="512" class="pf-sheath"/><rect x="230" y="44" width="10" height="512" class="pf-sheath"/>`;
      // 2nd layer: rotating tube (upper) and its motor coupling (lower)
      s += `<rect x="74" y="176" width="9" height="276" class="pf-rot"/><rect x="197" y="176" width="9" height="276" class="pf-rot"/>`;
      s += `<rect x="60" y="430" width="9" height="122" class="pf-rot"/><rect x="211" y="430" width="9" height="122" class="pf-rot"/>`;
      // mirror housing with the elliptical mirror surface and the aperture below it
      s += `<path d="M78.5,176 V158 Q86,84 201.5,62 V176" class="pf-line"/>`;
      s += `<path d="M78.5,168 H110 V206 M201.5,168 H170 V206" class="pf-line"/>`;
      // 1st layer: metal tube with SMF and MMF inside
      s += `<rect x="96" y="224" width="9" height="246" class="pf-wall"/><rect x="175" y="224" width="9" height="246" class="pf-wall"/>`;
      s += `<rect x="107" y="236" width="66" height="94" class="pf-fiber"/><rect x="107" y="330" width="66" height="114" class="pf-fiber"/>`;
      s += `<text x="140" y="283" text-anchor="middle" class="pf-h" transform="rotate(-90 140 283)">MMF</text><text x="140" y="387" text-anchor="middle" class="pf-h" transform="rotate(-90 140 387)">SMF</text>`;
      // beam: out of the fiber, onto the mirror, and to a focus in tissue
      const F = [400, 84];
      s += `<path d="M92.5,118.3 L140,228 L145.5,78.4" class="pf-beam"/><path d="M92.5,118.3 L${F[0]},${F[1]} M145.5,78.4 L${F[0]},${F[1]}" class="pf-beam"/>`;
      // tissue: a neuron at the focus
      s += `<path d="M392,76 L378,62 L370,64 M378,62 L376,50 M402,73 L400,56 L392,46 M400,56 L410,44 M410,80 L428,72 L440,76 M428,72 L434,60 M406,94 C414,104 402,112 410,124" class="pf-dend"/>`;
      s += `<circle cx="${F[0]}" cy="${F[1]}" r="11" class="pf-cell"/><circle cx="${F[0]}" cy="${F[1]}" r="3" class="f-sig"/>`;
      s += `<text x="16" y="24" class="pf-i">DBS electrode</text><text x="504" y="24" text-anchor="end" class="pf-i">Tissue</text><text x="86" y="52" class="pf-i">Elliptical mirror</text>`;
      s += `<text x="298" y="152" class="pf-t">6–8 µm spot, ~200 µm depth of field</text>`;
      // callouts
      const call = (ty, tx, title, lines) => {
        let o = `<line x1="286" y1="${ty}" x2="${tx}" y2="${ty}" class="pf-arrow" marker-end="url(#${a})"/>`;
        o += `<text x="292" y="${ty + 4}" class="pf-h">${title}</text>`;
        lines.forEach((l, i) => { o += `<text x="292" y="${ty + 19 + i * 14}" class="pf-t">· ${l}</text>`; });
        return o;
      };
      s += call(202, 154, "Mineral oil for index matching", ["Lower reflectance (instead of an 8° tilt)", "Beam grows for a larger aperture"]);
      s += call(270, 175, "Multi-mode fiber", ["Mirror tunnel for extended depth of focus"]);
      s += call(318, 186, "Metal tube for protection", ["Keeps the fibers from twisting", "Needs low surface roughness"]);
      s += call(386, 175, "Single-mode fiber", ["Short-wavelength light (650–800 nm)", "630HP (⌀ 4 ± 0.5 µm) has low throughput"]);
      // layer legend
      [["pf-fiber", "1st layer · stationary optical fibers"], ["pf-rot", "2nd layer · rotates with the motor"], ["pf-sheath", "3rd layer · clear plastic outer sheath"], ["pf-contact", "DBS electrode contacts"]].forEach(([cls, t], i) => {
        const y = 474 + i * 22;
        s += `<rect x="292" y="${y - 10}" width="12" height="12" rx="2" class="${cls}"/><text x="312" y="${y}" class="pf-t">${t}</text>`;
      });
      return s + `</svg>`;
    },
    soc(uid) {
      const a = "ah-" + uid, W = 520, H = 236;
      let s = `<svg viewBox="0 0 ${W} ${H}" class="dg" role="img" aria-label="AI SoC block diagram: RISC-V core, DMA and HyperRAM controller on an AXI4 bus, an AXI-to-APB bridge, and APB peripherals">${defs(a)}`;
      const blk = (x, y, w, h, t1, t2, acc) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" class="${acc ? "box-acc" : "box"}"/><text x="${x + w / 2}" y="${y + (t2 ? h / 2 - 2 : h / 2 + 4)}" text-anchor="middle" class="strong">${t1}</text>${t2 ? `<text x="${x + w / 2}" y="${y + h / 2 + 12}" text-anchor="middle" class="lbl">${t2}</text>` : ""}`;
      s += blk(16, 24, 110, 44, "RISC-V core") + blk(142, 24, 80, 44, "DMA", "", true) + blk(238, 24, 142, 44, "HyperRAM ctrl", "ASIC IP → Artix-7", true) + blk(446, 24, 66, 44, "HyperRAM");
      s += `<line x1="381" y1="46" x2="444" y2="46" class="wire" marker-start="url(#${a})" marker-end="url(#${a})"/><text x="413" y="39" text-anchor="middle" class="lbl">HyperBus</text>`;
      s += `<line x1="372" y1="16" x2="372" y2="78" class="xing"/><text x="388" y="84" class="xing-t">clock-domain</text><text x="388" y="97" class="xing-t">crossing</text>`;
      s += `<line x1="16" y1="104" x2="388" y2="104" class="bus"/><text x="16" y="122" class="lbl">AXI4</text>`;
      [71, 182, 309].forEach((x) => { s += `<line x1="${x}" y1="68" x2="${x}" y2="102" class="wire"/>`; });
      s += blk(200, 128, 122, 36, "AXI → APB", "", true);
      s += `<line x1="261" y1="106" x2="261" y2="128" class="wire"/><line x1="261" y1="164" x2="261" y2="182" class="wire"/>`;
      s += `<line x1="16" y1="184" x2="504" y2="184" class="bus"/><text x="504" y="178" text-anchor="end" class="lbl">APB</text>`;
      const per = [[16, "SPI · microSD"], [140, "PLIC / CLINT"], [264, "clock & reset"], [388, "system control"]];
      per.forEach(([x, t]) => { s += `<line x1="${x + 58}" y1="186" x2="${x + 58}" y2="198" class="wire"/>` + blk(x, 198, 116, 30, t, "", true); });
      return s + `</svg>`;
    },
  };

  /* ---------- CV viewer, copy buttons, downloads ---------- */
  let lastFocus = null;
  function openCV() {
    const cv = S.cv || {};
    if (!(cv.pages || []).length && cv.externalUrl) { window.open(cv.externalUrl, "_blank", "noopener"); return; }
    const pages = $("#cv-pages");
    if (!pages.childElementCount) pages.innerHTML = (cv.pages || []).map((src, i) => `<img src="${esc(src)}" alt="CV page ${i + 1}" width="1275" height="1650">`).join("");
    lastFocus = document.activeElement;
    $("#cv-overlay").hidden = false;
    document.body.classList.add("cv-open");
    $("#cv-close").focus();
  }
  function closeCV() {
    $("#cv-overlay").hidden = true;
    document.body.classList.remove("cv-open");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function setStatus(t) { $("#cv-status").textContent = t; }
  async function copy(btn) {
    const text = btn.getAttribute("data-copy"), label = btn.textContent;
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
    catch (e) {
      const addr = btn.parentElement.querySelector(".addr");
      if (addr) { const r = document.createRange(); r.selectNodeContents(addr); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      btn.textContent = "Selected, press Ctrl+C";
    }
    setTimeout(() => { btn.textContent = label; }, 1800);
  }
  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-open-cv]")) { e.preventDefault(); openCV(); return; }
    if (t.closest("[data-close-cv]") || t === $("#cv-overlay")) { closeCV(); return; }
    const tab = t.closest("[data-figtab]");
    if (tab) {
      const set = tab.closest(".figset"), i = +tab.getAttribute("data-figtab");
      set.querySelectorAll("[data-figtab]").forEach((b, k) => b.setAttribute("aria-selected", String(k === i)));
      set.querySelectorAll(".fig[role=tabpanel]").forEach((f, k) => { f.hidden = k !== i; });
      return;
    }
    const z = t.closest("[data-zoom]");
    if (z) { openZoom(z); return; }
    if (t.closest("[data-close-zoom]") || t === $("#zoom-overlay")) { closeZoom(); return; }
    const c = t.closest("[data-copy]");
    if (c) copy(c);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#zoom-overlay").hidden) closeZoom();
    else if (!$("#cv-overlay").hidden) closeCV();
  });
  function openZoom(btn) {
    const img = $("#zoom-img"), inner = btn.querySelector("img");
    img.src = btn.getAttribute("data-zoom");
    img.alt = inner ? inner.alt : "";
    $("#zoom-title").textContent = btn.getAttribute("data-zoom-title") || "Figure";
    lastFocus = btn;
    $("#zoom-overlay").hidden = false;
    document.body.classList.add("cv-open");
    $("#zoom-close").focus();
  }
  function closeZoom() {
    $("#zoom-overlay").hidden = true;
    document.body.classList.remove("cv-open");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  let downloadsReady = false;
  async function initCvActions() {
    const cv = S.cv || {}, save = $("#cv-save"), open = $("#cv-open");
    const inViewer = !!(window.claude && typeof window.claude.use === "function");
    if (cv.externalUrl) { open.href = cv.externalUrl; open.hidden = false; }
    else if (!inViewer && cv.pdf) { open.href = cv.pdf; open.hidden = false; }
    if (!inViewer || !cv.pdf || downloadsReady) return;
    downloadsReady = true;
    let dl = null;
    try { dl = await window.claude.use("downloads"); } catch (e) { dl = null; }
    if (!dl) return;
    if (!cv.externalUrl) open.hidden = true;
    save.hidden = false;
    save.addEventListener("click", async () => {
      setStatus("Preparing…");
      try {
        const res = await fetch(cv.pdf);
        if (!res.ok) throw { code: "fetch_failed" };
        await dl.save({ filename: cv.filename || "CV.pdf", data: await res.blob() });
        setStatus("Saved");
      } catch (err) {
        const code = err && err.code;
        if (code === "declined") setStatus("");
        else if (code === "rate_limited") setStatus("Try again in a moment.");
        else if (["unavailable", "not_granted", "capability_disabled", "capability_removed"].includes(code)) { save.hidden = true; setStatus("Saving isn't available here."); }
        else setStatus("The PDF couldn't be saved.");
      }
    });
  }

  /* ---------- Boot ---------- */
  renderHero();
  renderHighlights();
  renderVision();
  renderThread();
  renderResearch();
  renderProjects();
  renderPublications();
  renderAbout();
  renderFooter();
  renderNav();
  initCvActions();
  window.addEventListener("load", initCvActions);
})();
</script>
